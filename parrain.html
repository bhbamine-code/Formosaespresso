<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espace parrain | Formosa Espresso</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="theme-color" content="#161616">
<style>
:root{--ground:#FFFFFF;--panel:#F4F4F1;--ink:#161616;--muted:#666662;--line:#E3E3DE;--accent:#7A2E1F;--ok:#1E6B43;--warn:#8A5A00;--bad:#A3272A;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#111110;--panel:#1B1B19;--ink:#EDEDE8;--muted:#A3A39C;--line:#2C2C29;--accent:#D9826B;--ok:#7CCB9C;--warn:#E3B45C;--bad:#F08A86;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#111110;--panel:#1B1B19;--ink:#EDEDE8;--muted:#A3A39C;--line:#2C2C29;--accent:#D9826B;--ok:#7CCB9C;--warn:#E3B45C;--bad:#F08A86;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
header{border-bottom:1px solid var(--line)}header .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:1.25rem;font-weight:600;letter-spacing:-.03em;text-decoration:none;color:inherit;margin-inline-end:auto}.mark span{font-weight:400}
.langs{display:flex;gap:4px}.langs button{border:1px solid var(--line);background:none;color:var(--muted);padding:4px 10px;cursor:pointer;font:inherit;font-size:.85rem}.langs button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
main.wrap{padding-top:32px;padding-bottom:72px;display:grid;gap:28px}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}h1{font-size:clamp(2rem,6vw,3rem)}h2{font-size:1.4rem}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}.btn.wa{background:#1F7A45;border-color:#1F7A45;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.figs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.figs div{padding:16px;display:grid;gap:2px;border-inline-start:1px solid var(--line);min-width:0}.figs div:first-child{border-inline-start:0}
.figs b{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.1;font-variant-numeric:tabular-nums}.figs span{font-size:.82rem;color:var(--muted)}
@media (max-width:620px){.figs{grid-template-columns:1fr 1fr}.figs div:nth-child(3){border-inline-start:0}.figs div:nth-child(n+3){border-top:1px solid var(--line)}}
.card{border:1px solid var(--line);padding:clamp(18px,3vw,28px);display:grid;gap:14px}
.share{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}@media (max-width:620px){.share{grid-template-columns:1fr}}
.link{font-family:var(--mono);font-size:.92rem;background:var(--panel);padding:10px 12px;overflow-wrap:anywhere;direction:ltr;text-align:left}
.code{font-family:var(--mono);font-size:1.5rem;letter-spacing:.06em}
.qr{width:184px;background:#fff;padding:10px;border:1px solid var(--line);cursor:zoom-in}.qr svg{display:block;width:100%;height:auto}
.big{position:fixed;inset:0;background:#fff;z-index:50;display:grid;place-items:center;gap:16px;padding:24px;cursor:zoom-out;color:#161616;text-align:center;align-content:center}
.big svg{width:min(86vw,72vh);height:auto}.big .code{font-size:2rem}
table{width:100%;border-collapse:collapse;font-size:.94rem}th{text-align:start;font-family:var(--mono);font-weight:400;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.r,th.r{text-align:end;font-variant-numeric:tabular-nums}
.pill{font-size:.78rem;font-weight:600;white-space:nowrap}.s-pending{color:var(--warn)}.s-validated{color:var(--ok)}.s-paid{color:var(--muted)}.s-rejected{color:var(--bad)}
form.key{display:flex;gap:10px;flex-wrap:wrap}form.key input{flex:1 1 240px;min-height:46px;padding:0 12px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font:inherit;font-family:var(--mono)}
.err{color:var(--bad)}.note{font-size:.86rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}details ul{margin:10px 0 0;padding-inline-start:20px;display:grid;gap:6px;color:var(--muted);font-size:.93rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;z-index:60}
</style>
</head>
<body>
<header><div class="wrap"><a class="mark" href="/" dir="ltr">formosa <span>espresso</span></a><div class="langs" id="langs"></div></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast" hidden role="status"></div>
<script src="parrainage-data.js"></script>
<script src="qrcode.js"></script>
<script>
(function(){
const SITE = "https://formosaespresso.com/";
const WA = "886973872881";
const L = (fr, en, ar) => ({ fr, en, ar });
const STR = {
  title: L("espace parrain", "referrer area", "فضاء الشريك"),
  hello: L("Bonjour {n}", "Hello {n}", "مرحبًا {n}"),
  updated: L("Chiffres mis à jour le {d}.", "Figures updated on {d}.", "الأرقام محيّنة بتاريخ {d}."),
  enter: L("Collez la clé de votre lien parrain (reçu sur WhatsApp) pour voir vos résultats.", "Paste the key from your referral link (sent on WhatsApp) to see your results.", "الصق مفتاح رابطك (المرسل على واتساب) لرؤية نتائجك."),
  key: L("Clé personnelle", "Personal key", "المفتاح الشخصي"), open: L("Ouvrir", "Open", "فتح"), wait: L("Ouverture…", "Opening…", "جارٍ الفتح…"),
  bad: L("Clé inconnue ou pas encore activée. Vérifiez le lien reçu, ou écrivez-nous sur WhatsApp.", "Unknown key, or not activated yet. Check the link you received, or message us on WhatsApp.", "مفتاح غير معروف أو غير مفعّل بعد. تحقّق من الرابط أو راسلنا على واتساب."),
  forget: L("Oublier ma clé sur ce téléphone", "Forget my key on this phone", "انسَ مفتاحي على هذا الهاتف"),
  pending: L("En attente", "Pending", "في الانتظار"), validated: L("Validées", "Validated", "مصادق عليها"), paid: L("Payées", "Paid", "مدفوعة"), rejected: L("Refusées", "Rejected", "مرفوضة"),
  one_pending: L("en attente", "pending", "في الانتظار"), one_validated: L("validée", "validated", "مصادق عليه"), one_paid: L("payée", "paid", "مدفوع"), one_rejected: L("refusée", "rejected", "مرفوض"),
  owed: L("À recevoir", "To receive", "للاستلام"), paidTot: L("Déjà reçu", "Already received", "تم استلامه"),
  owedT: L("{n} inscription(s) validée(s) × {r}", "{n} validated sign-up(s) × {r}", "{n} تسجيل مصادق × {r}"),
  pendT: L("vérification sous 7 jours", "checked within 7 days", "تحقّق خلال 7 أيام"),
  yourCode: L("Votre code parrain", "Your referral code", "رمز الإحالة"),
  yourLink: L("Votre lien", "Your link", "رابطك"),
  how: L("Chez le client, faites-lui scanner le QR code, ou envoyez-lui votre lien sur WhatsApp. Il peut aussi taper votre code dans le formulaire.", "At the customer’s, let them scan the QR code, or send them your link on WhatsApp. They can also type your code in the form.", "عند الحريف، اجعله يمسح رمز QR، أو أرسل له رابطك على واتساب. يمكنه أيضًا كتابة رمزك في الاستمارة."),
  copy: L("Copier le lien", "Copy link", "نسخ الرابط"), copied: L("Lien copié", "Link copied", "تم نسخ الرابط"),
  shareWa: L("Envoyer sur WhatsApp", "Send on WhatsApp", "إرسال على واتساب"),
  shareMsg: L("Bonjour, je vous recommande Formosa Espresso pour le suivi de votre machine à café (rappels d’entretien, SAV, pièces). Créez votre espace client en une minute : {u}", "Hello, I recommend Formosa Espresso for your coffee machine follow-up (maintenance reminders, service, parts). Create your customer area in one minute: {u}", "مرحبًا، أنصحك بـ Formosa Espresso لمتابعة آلة القهوة (تذكير بالصيانة، خدمة ما بعد البيع، قطع الغيار). أنشئ فضاء الحريف في دقيقة: {u}"),
  zoom: L("Afficher en grand", "Show full screen", "عرض بالحجم الكامل"), tapClose: L("Touchez pour fermer", "Tap to close", "المس للإغلاق"),
  list: L("Vos inscriptions", "Your sign-ups", "تسجيلاتك"), none: L("Pas encore d’inscription. Partagez votre lien !", "No sign-ups yet. Share your link!", "لا توجد تسجيلات بعد. شارك رابطك!"),
  date: L("Date", "Date", "التاريخ"), client: L("Client", "Customer", "الحريف"), town: L("Ville", "Town", "المدينة"), st: L("Statut", "Status", "الحالة"),
  pays: L("Paiements reçus", "Payments received", "الدفعات المستلمة"), amount: L("Montant", "Amount", "المبلغ"), method: L("Moyen", "Method", "الطريقة"),
  rulesT: L("Rappel des règles", "Rules reminder", "تذكير بالشروط"),
  r1: L("Payé : un vrai client joignable, qui a ou cherche une machine espresso, et pas déjà connu de Formosa.", "Paid: a real, reachable customer who has or wants an espresso machine and is not already known to Formosa.", "يُدفع: حريف حقيقي يمكن الاتصال به، لديه أو يبحث عن آلة إسبريسو، وغير معروف مسبقًا لدى Formosa."),
  r2: L("Le client remplit lui-même le formulaire, avec son accord.", "The customer fills in the form themselves, with their consent.", "الحريف يملأ الاستمارة بنفسه وبموافقته."),
  r3: L("Paiement avant le {d} du mois suivant la validation.", "Payment before the {d}th of the month after validation.", "الدفع قبل يوم {d} من الشهر الموالي للمصادقة."),
  help: L("Une question ? Écrivez-nous sur WhatsApp", "A question? Message us on WhatsApp", "سؤال؟ راسلنا على واتساب")
};
const D = Object.assign({ reward: 10, payDay: 10, stats: [] }, window.FE_REF || {});
let lang = "fr", key = "", data = null, err = "", busy = false;
try { lang = localStorage.getItem("fe-lang") || "fr"; } catch(e){}
if (!["fr","en","ar"].includes(lang)) lang = "fr";
const T = o => o[lang] || o.fr, S = k => T(STR[k]);
const fill = (s, o) => Object.entries(o).reduce((a, [k, v]) => a.split("{" + k + "}").join(v), s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const money = n => Number(n || 0).toLocaleString("fr-FR") + (lang === "ar" ? " د.ت" : " DT");
const dfmt = d => { const x = new Date(d + "T12:00:00"); return isNaN(x) ? (d || "") : x.toLocaleDateString(lang === "ar" ? "ar-TN" : lang === "en" ? "en-GB" : "fr-FR", { day: "numeric", month: "short", year: "numeric" }); };
const $ = id => document.getElementById(id);
let tt; const toast = m => { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); };

/* déchiffrement : même méthode que l'Admin (PBKDF2-SHA256 150 000 tours → AES-GCM 256) */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
async function unlock(k){
  const enc = new TextEncoder();
  const h = hex(await crypto.subtle.digest("SHA-256", enc.encode("formosa-ref:" + k))).slice(0, 32);
  const entry = (D.stats || []).find(x => x.h === h); if (!entry) return null;
  const base = await crypto.subtle.importKey("raw", enc.encode(k), "PBKDF2", false, ["deriveKey"]);
  const aes = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(entry.s), iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(entry.i) }, aes, b64(entry.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryKey(k, remember){
  key = k.trim().replace(/^#/, ""); if (!key) return;
  busy = true; err = ""; draw();
  try { data = await unlock(key); } catch(e){ data = null; }
  busy = false;
  if (!data) { err = S("bad"); key = ""; try { localStorage.removeItem("fe-ref-key"); } catch(e){} }
  else if (remember) { try { localStorage.setItem("fe-ref-key", key); } catch(e){} }
  try { history.replaceState(null, "", location.pathname); } catch(e){}
  draw();
}

function qrSvg(text){ try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch(e){ return ""; } }
function langs(){
  $("langs").innerHTML = [["fr","FR"],["en","EN"],["ar","عربي"]].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${lang === k}">${l}</button>`).join("");
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
}
function draw(){
  langs();
  const app = $("app");
  if (!data) {
    app.innerHTML = `<div><p class="label">Formosa Espresso</p><h1>${esc(S("title"))}</h1></div>
      <div class="card"><p>${esc(S("enter"))}</p>
      <form class="key" id="keyForm"><input id="keyIn" autocomplete="off" spellcheck="false" aria-label="${esc(S("key"))}" placeholder="${esc(S("key"))}" dir="ltr"><button class="btn" type="submit"${busy ? " disabled" : ""}>${esc(busy ? S("wait") : S("open"))}</button></form>
      ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ""}</div>
      <p><a class="btn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">${esc(S("help"))}</a></p>`;
    return;
  }
  const t = data.totals || {}, url = SITE + "?ref=" + encodeURIComponent(data.code);
  const rows = data.rows || [], pays = data.payouts || [];
  const stl = s => S("one_" + (["validated","paid","rejected"].includes(s) ? s : "pending"));
  app.innerHTML = `<div><p class="label">${esc(S("title"))}</p><h1>${esc(fill(S("hello"), { n: data.name }))}</h1>${data.biz ? `<p class="muted">${esc(data.biz)}</p>` : ""}</div>
    <div class="figs">
      <div><span>${esc(S("owed"))}</span><b>${esc(money(t.owedDT))}</b><span>${esc(fill(S("owedT"), { n: t.validated || 0, r: money(data.reward ?? D.reward) }))}</span></div>
      <div><span>${esc(S("pending"))}</span><b>${t.pending || 0}</b><span>${esc(S("pendT"))}</span></div>
      <div><span>${esc(S("paidTot"))}</span><b>${esc(money(t.paidDT))}</b><span>${t.paid || 0} ${esc(S("paid").toLowerCase())}</span></div>
      <div><span>${esc(S("rejected"))}</span><b>${t.rejected || 0}</b><span>&nbsp;</span></div>
    </div>
    <p class="note">${esc(fill(S("updated"), { d: dfmt(data.updated || D.updated) }))}</p>
    <section class="card share"><div style="display:grid;gap:14px;min-width:0">
        <div><p class="label">${esc(S("yourCode"))}</p><p class="code" dir="ltr">${esc(data.code)}</p></div>
        <div><p class="label">${esc(S("yourLink"))}</p><p class="link">${esc(url)}</p></div>
        <p class="muted">${esc(S("how"))}</p>
        <div class="row"><button class="btn" type="button" data-copy>${esc(S("copy"))}</button><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(fill(S("shareMsg"), { u: url }))}" target="_blank" rel="noopener">${esc(S("shareWa"))}</a></div></div>
      <div style="display:grid;gap:8px;justify-items:center"><button class="qr" type="button" data-zoom aria-label="${esc(S("zoom"))}">${qrSvg(url)}</button><button class="btn ghost" type="button" data-zoom>${esc(S("zoom"))}</button></div>
    </section>
    <section style="display:grid;gap:12px"><h2>${esc(S("list"))}</h2>
      ${rows.length ? `<div style="overflow-x:auto"><table><thead><tr><th>${esc(S("date"))}</th><th>${esc(S("client"))}</th><th>${esc(S("town"))}</th><th>${esc(S("st"))}</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${esc(dfmt(r.d))}</td><td>${esc(r.n)}</td><td>${esc(r.c)}</td><td><span class="pill s-${esc(r.s)}">${esc(stl(r.s))}</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">${esc(S("none"))}</p>`}
    </section>
    ${pays.length ? `<section style="display:grid;gap:12px"><h2>${esc(S("pays"))}</h2><div style="overflow-x:auto"><table><thead><tr><th>${esc(S("date"))}</th><th>${esc(S("method"))}</th><th class="r">${esc(S("amount"))}</th></tr></thead><tbody>
      ${pays.map(p => `<tr><td>${esc(dfmt(p.d))}</td><td>${esc(p.m || "")}</td><td class="r">${esc(money(p.a))}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    <details class="card"><summary>${esc(S("rulesT"))}</summary><ul><li>${esc(S("r1"))}</li><li>${esc(S("r2"))}</li><li>${esc(fill(S("r3"), { d: D.payDay }))}</li></ul></details>
    <div class="row"><a class="btn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">${esc(S("help"))}</a><button class="btn ghost" type="button" data-forget>${esc(S("forget"))}</button></div>`;
}
function big(){
  const url = SITE + "?ref=" + encodeURIComponent(data.code);
  const d = document.createElement("div"); d.className = "big"; d.setAttribute("role", "dialog");
  d.innerHTML = `${qrSvg(url)}<p class="code" dir="ltr">${esc(data.code)}</p><p>${esc(S("tapClose"))}</p>`;
  d.addEventListener("click", () => d.remove()); document.body.appendChild(d);
}
document.addEventListener("click", ev => {
  const l = ev.target.closest("[data-lang]"); if (l) { lang = l.dataset.lang; try { localStorage.setItem("fe-lang", lang); } catch(e){} draw(); return; }
  if (ev.target.closest("[data-zoom]")) { big(); return; }
  if (ev.target.closest("[data-copy]")) { const u = SITE + "?ref=" + encodeURIComponent(data.code); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast(S("copied")), () => prompt("", u)); return; }
  if (ev.target.closest("[data-forget]")) { try { localStorage.removeItem("fe-ref-key"); } catch(e){} data = null; key = ""; draw(); }
});
document.addEventListener("submit", ev => { if (ev.target.id === "keyForm") { ev.preventDefault(); tryKey($("keyIn").value, true); } });

let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem("fe-ref-key") || ""; } catch(e){} }
draw();
if (start) tryKey(decodeURIComponent(start), true);
})();
</script>
</body>
</html>
