<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="screen" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c7ccd1"/><stop offset="1" stop-color="#7e858c"/></radialGradient>
    <radialGradient id="gasket" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#3b3e42"/><stop offset=".8" stop-color="#1b1c1e"/><stop offset="1" stop-color="#0f1011"/></radialGradient>
    <linearGradient id="handle" x1="0" x2="1"><stop offset="0" stop-color="#1a1b1d"/><stop offset=".5" stop-color="#4b4f54"/><stop offset="1" stop-color="#16171a"/></linearGradient>
    <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#6e757c" opacity=".55"/></pattern>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="100" cy="176" rx="82" ry="8" fill="url(#sh)"/>
  <!-- gasket (back) -->
  <circle cx="132" cy="78" r="44" fill="url(#gasket)"/>
  <circle cx="132" cy="78" r="30" fill="#f4f4f1"/>
  <circle cx="132" cy="78" r="30" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="2"/>
  <ellipse cx="118" cy="56" rx="14" ry="4" fill="#fff" opacity=".18" transform="rotate(-30 118 56)"/>
  <!-- shower screen -->
  <circle cx="78" cy="112" r="50" fill="url(#screen)"/>
  <circle cx="78" cy="112" r="40" fill="url(#mesh)"/>
  <circle cx="78" cy="112" r="40" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
  <circle cx="78" cy="112" r="5" fill="#8d949b"/>
  <circle cx="78" cy="112" r="50" fill="none" stroke="#6f767d" stroke-width="2"/>
  <!-- brush -->
  <g transform="rotate(-35 150 140)">
    <rect x="106" y="134" width="70" height="12" rx="6" fill="url(#handle)"/>
    <rect x="174" y="128" width="22" height="24" rx="4" fill="#2c2e31"/>
    <path d="M176 128 v-10 M181 128 v-12 M186 128 v-12 M191 128 v-10 M176 152 v10 M181 152 v12 M186 152 v12 M191 152 v10" stroke="#55595e" stroke-width="2.4" stroke-linecap="round"/>
