    <radialGradient id="cof" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b7773f"/><stop offset="1" stop-color="#7a4420"/></radialGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
