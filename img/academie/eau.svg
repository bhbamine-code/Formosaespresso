<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a463"/><stop offset=".5" stop-color="#b8662f"/><stop offset="1" stop-color="#7d3b17"/></linearGradient>
    <radialGradient id="water" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#2a7fc0"/></radialGradient>
    <radialGradient id="scale" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#f3efe6"/><stop offset=".85" stop-color="#ddd5c4"/><stop offset="1" stop-color="#c9bfa8"/></radialGradient>
    <radialGradient id="drop" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#2a7fc0"/></radialGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
