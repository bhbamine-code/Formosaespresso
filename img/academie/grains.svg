<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="beanA" x1="0" x2="1"><stop offset="0" stop-color="#4a2410"/><stop offset=".45" stop-color="#8a4b24"/><stop offset="1" stop-color="#3a1b0b"/></linearGradient>
    <linearGradient id="beanR" x1="0" x2="1"><stop offset="0" stop-color="#3b1d0d"/><stop offset=".45" stop-color="#6e3a1c"/><stop offset="1" stop-color="#2e1508"/></linearGradient>
    <radialGradient id="cherry" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ff6b5a"/><stop offset=".6" stop-color="#c2271c"/><stop offset="1" stop-color="#7d1410"/></radialGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- branch -->
  <path d="M20 40 C 80 30, 120 60, 160 46" fill="none" stroke="#6b4a2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 36 c -10 -22, 10 -32, 30 -26 c -6 18, -16 26, -30 26 z" fill="#2f7d3a"/>
  <path d="M60 36 l 26 -22" stroke="#1f5a28" stroke-width="1.5"/>
  <path d="M124 52 c 8 -22, 32 -20, 40 -6 c -16 10, -28 12, -40 6 z" fill="#3b9047"/>
  <circle cx="98" cy="52" r="10" fill="url(#cherry)"/><circle cx="114" cy="56" r="9" fill="url(#cherry)"/><circle cx="104" cy="66" r="9" fill="url(#cherry)"/>
  <!-- arabica: elongated, S crease -->
  <ellipse cx="96" cy="150" rx="42" ry="8" fill="url(#sh)"/>
  <g transform="rotate(-12 96 118)">
    <ellipse cx="96" cy="118" rx="24" ry="38" fill="url(#beanA)"/>
    <path d="M96 82 C 84 100, 108 118, 96 136 C 90 146, 96 152, 96 154" fill="none" stroke="#2a1206" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="86" cy="104" rx="5" ry="13" fill="#fff" opacity=".14"/>
  </g>
  <!-- robusta: round, straight crease -->
  <ellipse cx="228" cy="150" rx="40" ry="8" fill="url(#sh)"/>
  <g transform="rotate(10 228 120)">
    <ellipse cx="228" cy="120" rx="27" ry="30" fill="url(#beanR)"/>
    <path d="M228 92 L 228 148" stroke="#1e0c04" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="216" cy="108" rx="5" ry="10" fill="#fff" opacity=".12"/>
  </g>
  <!-- labels as letters A / R (universal) -->
  <circle cx="96" cy="170" r="0" />
</svg>
