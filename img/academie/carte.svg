<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".3"/><stop offset="1" stop-color="#e3e9ec" stop-opacity=".9"/></linearGradient>
    <linearGradient id="esp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2e12"/><stop offset="1" stop-color="#2d1406"/></linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c29c"/><stop offset="1" stop-color="#c79a6a"/></linearGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- macchiato: small glass, espresso + dot of foam -->
  <ellipse cx="40" cy="166" rx="24" ry="5" fill="url(#sh)"/>
  <path d="M22 110 h36 l-3 52 h-30 z" fill="url(#glass)" stroke="#c7cfd4" stroke-width="1.5"/>
  <path d="M24 136 h32 l-1.6 24 h-28.8 z" fill="url(#esp)"/>
  <path d="M24 128 h32 v8 h-32 z" fill="#f7f1e8"/>
  <!-- cortado: espresso + equal milk, thin foam -->
  <ellipse cx="108" cy="166" rx="28" ry="5" fill="url(#sh)"/>
  <path d="M86 96 h44 l-3 66 h-38 z" fill="url(#glass)" stroke="#c7cfd4" stroke-width="1.5"/>
  <path d="M88 132 h40 l-1.6 28 h-36.8 z" fill="url(#esp)"/>
  <path d="M88.6 108 h38.8 v24 h-38.8 z" fill="url(#milk)"/>
  <path d="M88.6 103 h38.8 v5 h-38.8 z" fill="#f7f1e8"/>
  <!-- cappuccino: thick foam -->
  <ellipse cx="184" cy="166" rx="32" ry="5" fill="url(#sh)"/>
  <path d="M158 80 h52 l-4 82 h-44 z" fill="url(#glass)" stroke="#c7cfd4" stroke-width="1.5"/>
  <path d="M160 136 h48 l-1.4 24 h-45.2 z" fill="url(#esp)"/>
  <path d="M160.6 108 h46.8 v28 h-46.8 z" fill="url(#milk)"/>
  <path d="M160.6 86 h46.8 v22 h-46.8 z" fill="#f7f1e8"/>
  <!-- latte: tall, thin foam -->
  <ellipse cx="268" cy="166" rx="32" ry="5" fill="url(#sh)"/>
  <path d="M242 50 h52 l-4 112 h-44 z" fill="url(#glass)" stroke="#c7cfd4" stroke-width="1.5"/>
  <path d="M244 140 h48 l-1.2 20 h-45.6 z" fill="url(#esp)"/>
  <path d="M244.4 66 h47.2 v74 h-47.2 z" fill="url(#milk)"/>
  <path d="M244.4 58 h47.2 v8 h-47.2 z" fill="#f7f1e8"/>
</svg>
